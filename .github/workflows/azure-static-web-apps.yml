# Deploys Lantern Maps to Azure Static Web Apps: the exported site from out/,
# and the content API from api/ as managed Functions beside it.
#
# One secret is needed, AZURE_STATIC_WEB_APPS_API_TOKEN — Azure adds it to the
# repository itself when you create the Static Web App from this repo.
#
# The storage connection string is NOT here. It belongs in the Static Web App's
# application settings, where it is not in source control: Azure portal →
# the Static Web App → Environment variables → AZURE_STORAGE_CONNECTION_STRING.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build the site
        run: |
          npm ci
          npm run build

      - name: Check
        run: npm run lint

      - name: Test the API
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The site is already built above, so Oryx has nothing left to do.
          app_location: "out"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close the preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
