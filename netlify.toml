# Kept so the existing Netlify deploy keeps working while the move to Azure
# Static Web Apps happens. The app is a static export now, so there is no
# Next.js runtime to wire up and no plugin needed — just the exported folder.
#
# Once the Static Web App is live and DNS points at it, this file and the
# Netlify site can go.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next 16 requires >= 20.9
  NODE_VERSION = "22"

# The service worker must be revalidated on every request, or a deploy can go
# unnoticed for as long as a cached copy stays fresh.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The content API lives on Azure; Netlify only ever serves the static site, so
# there is nothing here to proxy.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
